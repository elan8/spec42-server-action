name: "Spec42 Server Submit"
description: "Submit a source snapshot to Spec42 Server and optionally wait for run completion."
author: "Spec42"

inputs:
  server_url:
    description: "Spec42 Server base URL, for example https://spec42.example.com"
    required: true
  project_token:
    description: "Spec42 project token used as Bearer auth"
    required: true
  analysis_root:
    description: "Path to analyze and upload as workspace zip"
    required: false
    default: "."
  poll_seconds:
    description: "Polling interval in seconds when waiting for completion"
    required: false
    default: "5"
  timeout_seconds:
    description: "Maximum wait time in seconds when wait_for_completion is true"
    required: false
    default: "1800"
  wait_for_completion:
    description: "If true, poll /v1/runs/{id} until succeeded or failed"
    required: false
    default: "true"
  base_run_id:
    description: "Optional explicit base Spec42 run id used when generating a PR summary"
    required: false
    default: ""
  base_branch:
    description: "Optional base branch for automatic base run lookup; defaults to pull_request.base.ref"
    required: false
    default: ""
  generate_pr_summary:
    description: "If true, fetch a GitHub-ready PR summary Markdown file after the head run completes"
    required: false
    default: "false"
  post_pr_comment:
    description: "If true, create or update a pull request comment with the generated PR summary"
    required: false
    default: "false"
  pr_comment_marker:
    description: "Hidden marker used to find and update the existing Spec42 pull request comment"
    required: false
    default: "<!-- spec42-pr-summary -->"
  public_base_url:
    description: "Externally reachable Spec42 Server URL used inside PR summary links; defaults to server_url"
    required: false
    default: ""
  pr_summary_path:
    description: "Optional path where the PR summary Markdown should be written"
    required: false
    default: ""
  github_token:
    description: "Optional GitHub token for commit status reporting"
    required: false
    default: ""
  update_github_status:
    description: "If true, publish pending/final commit status to GitHub"
    required: false
    default: "false"
  github_status_context:
    description: "GitHub commit status context name"
    required: false
    default: "spec42/server"

outputs:
  run_id:
    description: "Created Spec42 run id"
    value: ${{ steps.submit.outputs.run_id }}
  run_status:
    description: "Final run status when wait_for_completion=true, otherwise queued"
    value: ${{ steps.submit.outputs.run_status }}
  run_api_url:
    description: "Run API URL on Spec42 Server"
    value: ${{ steps.submit.outputs.run_api_url }}
  pr_summary_path:
    description: "Path to the generated PR summary Markdown file when generate_pr_summary=true"
    value: ${{ steps.submit.outputs.pr_summary_path }}
  pr_summary_api_url:
    description: "PR summary API URL when generate_pr_summary=true"
    value: ${{ steps.submit.outputs.pr_summary_api_url }}
  base_run_id:
    description: "Resolved base Spec42 run id used for PR summary generation"
    value: ${{ steps.submit.outputs.base_run_id }}
  pr_comment_url:
    description: "GitHub PR comment URL when post_pr_comment=true"
    value: ${{ steps.submit.outputs.pr_comment_url }}
  pr_comment_action:
    description: "Whether the GitHub PR comment was created or updated"
    value: ${{ steps.submit.outputs.pr_comment_action }}
  github_status_state:
    description: "GitHub commit status state (when enabled)"
    value: ${{ steps.submit.outputs.github_status_state }}

runs:
  using: "composite"
  steps:
    - name: Submit analysis request
      id: submit
      shell: bash
      env:
        INPUT_SERVER_URL: ${{ inputs.server_url }}
        INPUT_PROJECT_TOKEN: ${{ inputs.project_token }}
        INPUT_ANALYSIS_ROOT: ${{ inputs.analysis_root }}
        INPUT_POLL_SECONDS: ${{ inputs.poll_seconds }}
        INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        INPUT_WAIT_FOR_COMPLETION: ${{ inputs.wait_for_completion }}
        INPUT_BASE_RUN_ID: ${{ inputs.base_run_id }}
        INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
        INPUT_GENERATE_PR_SUMMARY: ${{ inputs.generate_pr_summary }}
        INPUT_POST_PR_COMMENT: ${{ inputs.post_pr_comment }}
        INPUT_PR_COMMENT_MARKER: ${{ inputs.pr_comment_marker }}
        INPUT_PUBLIC_BASE_URL: ${{ inputs.public_base_url }}
        INPUT_PR_SUMMARY_PATH: ${{ inputs.pr_summary_path }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_UPDATE_GITHUB_STATUS: ${{ inputs.update_github_status }}
        INPUT_GITHUB_STATUS_CONTEXT: ${{ inputs.github_status_context }}
      run: bash "${{ github.action_path }}/scripts/submit.sh"
